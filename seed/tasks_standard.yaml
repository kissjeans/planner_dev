    name: "Заполнение брифа"
    duration_hours: 8
    is_splittable: false
    pair_mode: none
    optional_in_lite: false
    depends_on: []
    assignees:
      - { name: "Андрей", strictness: "A", priority: 0 }
      - { name: "Рай", strictness: "A", priority: 1 }

