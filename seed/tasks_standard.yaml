# Standard presales template (plan C1, §6): tasks 1–18 (everything except #19).
# Conventions:
#   duration_hours = working-days × 8 (8h = 1 working day window)
#   pair_mode: none | optional | required
#   assignees are priority-ordered (priority 0 = chosen first when free);
#     '*' priority person from §6 is listed first with strictness A
#   depends_on: bare int = FS, no lag; {ord, lag_days} = FS + working-day lag
#   optional_in_lite: true for tasks dropped by the lite template (5, 9, 11, 12)
tasks:
