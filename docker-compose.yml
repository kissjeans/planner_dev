version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - planner-network

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - planner-network

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides any DATABASE_URL from .env: in compose the app must use the
      # in-network postgres:5432, not the host-run localhost:5435 from .env.
      DATABASE_URL: postgresql+asyncpg://planner:${POSTGRES_PASSWORD:-planner}@postgres:5432/planner
    ports:
      - "127.0.0.1:8000:8000"          # FastAPI admin board
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - whisper_cache:/root/.cache    # persist faster-whisper model across restarts
    networks:
      - planner-network

volumes:
  postgres_data:
  whisper_cache:

networks:
  planner-network:
    driver: bridge
