{% extends "base.html" %}
{% block title %}Аудит{% endblock %}
{% block body %}
<h1>Журнал изменений</h1>
<table>
  <thead><tr><th>Когда</th><th>Кто</th><th>Действие</th><th>Объект</th></tr></thead>
  <tbody>
  {% for e in entries %}
    <tr>
      <td>{{ e.created_at }}</td>
      <td>{{ e.actor_name or "—" }}</td>
      <td>{{ e.action }}</td>
      <td>{{ e.entity_type }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
